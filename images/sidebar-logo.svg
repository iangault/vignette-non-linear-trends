<svg width="100%" viewBox="0 0 100 100" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Non-linear trend icon</title>
  <desc>A non-monotonic fitted curve with a shaded confidence band and scattered observations</desc>

  <!-- confidence band -->
  <polygon points="15,70 30,45 45,30 60,50 75,60 90,35
    90,55 75,80 60,70 45,50 30,65 15,90"
    fill="#7a9e8a" opacity="0.3"/>

  <!-- fitted non-monotonic curve -->
  <polyline points="15,80 30,55 45,40 60,60 75,70 90,45"
    fill="none" stroke="#4a7c6f" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- scattered observations -->
  <circle cx="15" cy="84" r="3.5" fill="#b85c38"/>
  <circle cx="30" cy="50" r="3.5" fill="#b85c38"/>
  <circle cx="45" cy="44" r="3.5" fill="#b85c38"/>
  <circle cx="60" cy="64" r="3.5" fill="#b85c38"/>
  <circle cx="75" cy="74" r="3.5" fill="#b85c38"/>
  <circle cx="90" cy="40" r="3.5" fill="#b85c38"/>
</svg>
