project:
  type: website
  execute-dir: project
  render:
    - index.qmd
    - chapters/regression-framework.qmd
    - chapters/transformations.qmd
    - chapters/piecewise-regression.qmd
    - chapters/changepoint-detection.qmd
    - chapters/knn-regression.qmd
    - chapters/loess-smoothing.qmd
    - chapters/gam.qmd
    - chapters/gamm.qmd
    - chapters/linear-vs-nonlinear-comparison.qmd

website:
  title: "Modelling Beyond a Straight Line: Regression for Environmental Consultants"
  page-navigation: true
  navbar:
    right:
      - icon: github
        href: https://github.com/iangault/vignette-non-linear-trends
        aria-label: GitHub repository
  page-footer:
    left: "© 2026 Ian Gault"
  sidebar:
    style: docked
    search: true
    contents:
      - text: "Home"
        href: index.qmd
      - section: "Framework"
        contents:
          - text: "1. The Regression Framework"
            href: chapters/regression-framework.qmd
          - text: "2. Transformations"
            href: chapters/transformations.qmd
      - section: "Parametric Methods"
        contents:
          - text: "3. Piecewise / Segmented Linear Regression"
            href: chapters/piecewise-regression.qmd
          - text: "4. Changepoint Detection"
            href: chapters/changepoint-detection.qmd
      - section: "Nonparametric Methods"
        contents:
          - text: "5. k-Nearest Neighbors Regression"
            href: chapters/knn-regression.qmd
          - text: "6. LOESS Smoothing"
            href: chapters/loess-smoothing.qmd
      - section: "Semi-Parametric Methods"
        contents:
          - text: "7. Generalized Additive Models"
            href: chapters/gam.qmd
          - text: "8. Generalized Additive Mixed Models"
            href: chapters/gamm.qmd
      - section: "Comparison"
        contents:
          - text: "9. Linear vs. Nonlinear Comparison"
            href: chapters/linear-vs-nonlinear-comparison.qmd

knitr:
  opts_chunk:
    fig.align: center

format:
  html:
    theme:
      light: flatly
      dark: darkly
    css: styles.css
    toc: true
    toc-location: right
    number-sections: true
    number-depth: 3
    code-fold: false
    grid:
      sidebar-width: 300px
      body-width: 1150px
      margin-width: 300px
